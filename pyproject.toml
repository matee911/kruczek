# Konfiguracja uv i pytesta. Wersję pluginu prowadzi .claude-plugin/plugin.json —
# tu jest tylko wymagana przez uv atrapa (`package = false`: niczego nie budujemy).
[project]
name = "kruczek"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=9.1", "holidays>=0.106"]

[tool.uv]
package = false

[tool.pytest]
minversion = "9.0"
pythonpath = ["scripts"]
testpaths = ["tests", "scripts/kruczek_core", "scripts/kruczek_strona"]
addopts = ["-ra", "--doctest-modules", "--strict-config", "--strict-markers"]
