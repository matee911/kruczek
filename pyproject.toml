# Konfiguracja uv i pytesta. Wersję pluginu prowadzi .claude-plugin/plugin.json —
# tu jest tylko wymagana przez uv atrapa (`package = false`: niczego nie budujemy).
[project]
name = "kruczek"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
# Strona (kruczek serve): te same wersje co w nagłówku PEP 723 scripts/kruczek_serve.py (pilnuje test).
serve = ["fastapi==0.141.1", "pydantic==2.13.5", "starlette==1.7.0", "jinjax==0.66", "jinja2==3.1.6", "uvicorn==0.54.0", "python-multipart==0.0.32"]
dev = ["pytest>=9.1", "holidays>=0.106", "httpx2==2.13.1",{include-group = "serve"}]

[tool.uv]
package = false

[tool.pytest]
minversion = "9.0"
pythonpath = ["scripts"]
testpaths = ["tests", "scripts/kruczek_core", "scripts/kruczek_strona"]
addopts = ["-ra", "--doctest-modules", "--strict-config", "--strict-markers"]
