name: Smoketest

# Mechaniczny "czy się w ogóle uruchamia" test dla skryptów kruczka. Nie sprawdza logiki
# biznesowej (od tego jest test_kontrola_logika.py, uruchamiany tu też) — łapie błędy
# składni i crashe przy starcie, w tym regresje specyficzne dla bashu 3.2 (domyślny
# /bin/bash na macOS — patrz job macos-bash32 i scripts/smoketest.sh).
#
# Job ubuntu-owy mierzy przy okazji pokrycie testami i wysyła je do codecov.io.
# Zakres pomiaru i powód, dla którego nie obejmuje skryptów CLI — w .coveragerc.

# push tylko na main — gałąź z PR testuje pull_request; oba naraz uruchamiały każdy job dwa razy.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-permissions:
    # Szybki, niezależny od systemu check: bit +x jest częścią trybu pliku śledzonego
    # przez git (100755 vs 100644), więc to samo z ubuntu-latest wystarcza dla obu OS.
    # Znalezione na żywym organizmie 2026-08-28: archiwa.sh, gen-claude-md.sh i
    # metadane.sh były commitowane bez +x — skille wywołują skrypty bezpośrednio
    # (bez "bash" z przodu), więc to kończyło się "Permission denied" w realnej sesji.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sprawdź bit +x na skryptach .sh/.py
        run: |
          set -euo pipefail
          MISSING=0
          for f in $(git ls-files 'scripts/*.sh' 'scripts/*.py'); do
            case "$f" in
              # pakiet importowany przez teczka.py, nie CLI
              scripts/kruczek_core/*) continue ;;
              # pakiet strony importowany przez kruczek_serve.py, nie CLI (budowa_css.py: uv run --script)
              scripts/kruczek_strona/*) continue ;;
            esac
            case "$(basename "$f")" in
              # celowo bez +x: nie do bezpośredniego uruchamiania (source/import, nie CLI)
              lib.sh|utils.py|kontrola_logika.py) continue ;;
              eml_forensics_logika.py|eml_forensics_raport.py) continue ;;
              build_pismo_logic.py) continue ;;
              test_*.py) continue ;;
            esac
            mode=$(git ls-files -s "$f" | awk '{print $1}')
            if [ "$mode" != "100755" ]; then
              echo "✗ brak +x: $f (tryb=$mode, oczekiwano 100755)"
              MISSING=1
            fi
          done
          if [ "$MISSING" -eq 1 ]; then
            echo
            echo "Napraw lokalnie: chmod +x <plik> && git add <plik> && git commit"
            exit 1
          fi
          echo "OK — wszystkie skrypty CLI mają +x"

  python-min:
    # Najstarszy wspierany Python. Składnia z 3.12 (backslash w wyrażeniu f-stringu,
    # `type X = ...`) przechodziła na jobach z nowszym interpreterem, a u użytkownika
    # z 3.11 eml_forensics.py padał SyntaxError-em przy starcie.
    needs: check-permissions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Kompilacja wszystkich skryptów
        run: python -m compileall -q scripts
      - name: Testy (unittest + doctesty, odkrywane)
        run: python scripts/run_tests.py

  pytest:
    # Testy rdzenia teczki (scripts/kruczek_core) — pytest i holidays tylko tutaj,
    # przez uv; stare testy dalej idą przez scripts/run_tests.py bez zależności.
    needs: check-permissions
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - name: pytest (kruczek_core + teczka.py)
        if: matrix.python != '3.11'
        run: uv run --python ${{ matrix.python }} pytest
      # Pokrycie z pytest mierzymy raz (3.11); codecov łączy je z uploadem z smoketest-ubuntu
      # (run_tests.py) — bez tego kod testowany tylko przez pytest wychodził jako niepokryty.
      - name: pytest z pokryciem (kruczek_core + teczka.py + strona)
        if: matrix.python == '3.11'
        run: |
          uv run --python 3.11 coverage run -m pytest
          uv run --python 3.11 coverage xml
      - name: Wyślij pokrycie do codecov
        if: matrix.python == '3.11'
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  smoketest-ubuntu:
    needs: check-permissions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # skrypty Pythona startują przez `uv run --script` (shebang), np. teczka.py z nowa-sprawa.sh
      - uses: astral-sh/setup-uv@v10.3.0
      - name: Smoketest wszystkich skryptów
        run: bash scripts/smoketest.sh scripts
      # coverage jest instalowany tylko tutaj: pokrycie mierzymy raz, na ubuntu.
      # Job macos-owy celowo zostaje na gołym python3 — jest od regresji specyficznych
      # dla macOS (bash 3.2), nie od metryk, a drugi upload tego samego pomiaru tylko
      # zaszumiałby raport w codecov.
      # setup-python, a nie systemowy python3: Ubuntu oznacza swojego interpretera jako
      # "externally managed" (PEP 668), przez co gołe `pip install` kończy się błędem.
      # Wszystko wołamy przez `python -m`, żeby nie zależeć od tego, czy katalog ze
      # skryptami pip-a wylądował w PATH.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Zainstaluj coverage
        run: python -m pip install coverage
      # Jeden krok zamiast listy plików: run_tests.py sam odkrywa scripts/test_*.py
      # ORAZ doctesty we wszystkich importowalnych modułach. Wymienianie testów z nazwy
      # sprawiało, że nowy plik testowy albo doctest w nowym module po prostu nie chodził.
      - name: Testy (unittest + doctesty, odkrywane)
        run: python -m coverage run scripts/run_tests.py
      # Bez `coverage combine` — od czasu, gdy testy odpala jeden proces (run_tests.py),
      # nie ma czego łączyć, a combine na pojedynczym pliku danych kończy się błędem.
      - name: Zbierz pokrycie
        run: |
          python -m coverage report
          python -m coverage xml
      - name: Wyślij pokrycie do codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  smoketest-macos:
    # macOS ma domyślnie /bin/bash w wersji 3.2.57 (Apple nie aktualizuje ze względu na
    # licencję GPLv3) — w tej wersji "${arr[@]}" na PUSTEJ tablicy pod `set -u` rzuca
    # "unbound variable", naprawione dopiero w bashu 4.4+. scripts/smoketest.sh uruchamia
    # każdy skrypt też pod /bin/bash właśnie po to, żeby to złapać niezależnie od tego,
    # jaki bash jest domyślny w PATH na runnerze.
    needs: check-permissions
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # skrypty Pythona startują przez `uv run --script` (shebang), np. teczka.py z nowa-sprawa.sh
      - uses: astral-sh/setup-uv@v10.3.0
      - name: Smoketest wszystkich skryptów
        run: bash scripts/smoketest.sh scripts
      - name: Testy (unittest + doctesty, odkrywane)
        run: python3 scripts/run_tests.py
